<script>
  var photos = [{"src": "images/photography/environment/01-sage-grouse.jpg", "headline": "Grazing and grouse", "caption": "Wildlife technician Sam Siller makes sure a radio collar fits snugly around a sage grouse hen's neck March 18 west of Rogerson. Siller is part of a capture team collecting data for a 10-year research project looking at the impact of livestock grazing on sage grouse."}, {"src": "images/photography/environment/01a-pronghorn.jpg", "headline": "Where do the antelope play?", "caption": "Ryan Walrath (left) and Jon Prokott of Idaho Fish and Game process a pronghorn Aug. 8 near Bellevue. Fish and Game is collaring pronghorn in order to track them and gather new information on migration patterns."}, {"src": "images/photography/environment/02a-badger.jpg", "headline": "What happened at the Badger Fire?", "caption": "USFS district wildlife biologist Scott Soletti walks Oct. 9 over land charred by the Badger Fire. The 90,000-acre burn will likely have some positive impacts, but loss of habitat could pose major challenges for several wildlife species."}, {"src": "images/photography/environment/02b-badger.jpg", "headline": "What happened at the Badger Fire?", "caption": "Firefighters on the BAER (Burn Area Emergency Response) team talk to Scott Soletti on Oct. 9. The BAER team spent about a week in the South Hills after the Badger Fire, removing snags and assessing the damage."}, {"src": "images/photography/environment/03-badger.jpg", "headline": "What happened at the Badger Fire?", "caption": "USFS district biologist Scott Soletti surveys the damage caused by the Badger Fire Oct. 9 along Rock Creek in the South Hills."}, {"src": "images/photography/environment/04-ranchers.jpg", "headline": "Blacker pastures", "caption": "Doug Pickett (left) and his son Strom sort bulls Dec. 22 during a snow flurry at their ranch near Oakley. The Badger Fire killed more than a hundred sheep and cows and burned thousands of acres of rangeland."}, {"src": "images/photography/environment/05a-muleys.jpg", "headline": "Catching deer in the desert", "caption": "Idaho Fish Game Wildlife Biologist Brandon Tycz carries poles Friday to a mule deer capture site near King Hill."}, {"src": "images/photography/environment/05b-muleys.jpg", "headline": "Catching deer in the desert", "caption": "Reservist Glenn McNally (left) and habitat biologist Terry Gregory put up a drive net Friday at a capture site near King Hill. A helicopter herds mule deer into the nets, then a capture team quickly grabs them and puts a GPS tracking collar around the fawns' necks."}, {"src": "images/photography/environment/05c-cover-muleys.jpg", "headline": "Catching deer in the desert", "caption": "Wildlife technician Amy Hilger holds a mule deer tight Friday at a capture site near King Hill. Idaho Fish and Game collars mule deer fawns in order to monitor winter survival rates."}, {"src": "images/photography/environment/05d-muleys.jpg", "headline": "Catching deer in the desert", "caption": "Richard Bean pulls a mule deer fawn out of a net at a capture site Friday while Nick Robatcek looks on. Thousands of mule deer spend the winter in the desert near King Hill."}, {"src": "images/photography/environment/06-burn.jpg", "headline": "A good burn", "caption": "U.S. Forest Service District Wildlife Biologist Scott Soletti uses a drip torch at a prescribed burn Sept. 25 in the South Hills. Last week's 67-acre fire was small compared to the large burns the USFS has planned, but helped firefighters train for larger projects."}, {"src": "images/photography/environment/07a-pinyon.jpg", "headline": "The pinyon pine mystery", "caption": "U.S. Forest Service Plant Pathologist Angel Saavedra digs out the roots of a young, dead pinyon pine tree in late August at Castle Rocks State Park. Pinyon pines appear to be dying faster than usual at City of Rocks National Reserve and Castle Rocks State Park, prompting concern from park leaders."}, {"src": "images/photography/environment/07b-pinyon.jpg", "headline": "The pinyon pine mystery", "caption": "Angel Saavedra scrapes at the bark of a pinyon pine at Castle Rocks State Park near Almo. Pinyon pines \"pitch\" gobs of sap when Ips beetles start feeding on their inner bark in an effort to expel the invaders."}, {"src": "images/photography/environment/07c-pinyon.jpg", "headline": "The pinyon pine mystery", "caption": "Angel Saavedra holds an Ips beetle larva that he gouged out of a dead pinyon pine. The beetle is a native species that feeds on the inner bark of trees."}, {"src": "images/photography/environment/07d-pinyon.jpg", "headline": "The pinyon pine mystery", "caption": "Maria Newcomb, a US Forest Service plant pathologist, examines a young pinyon pine at Castle Rocks State Park."}, {"src": "images/photography/environment/Bats%201.jpg", "headline": "Batmen", "caption": "Washington Department of Fish and Wildlife biologist Michael Atamian prepares a drone before the start of a bat survey June 15 at an abandoned ranch house in remote Lincoln County."}, {"src": "images/photography/environment/best%20bats.jpg", "headline": "Batmen", "caption": "Washington Department of Fish and Wildlife biologists Carrie Lowe, left, and Michael Atamian go over the results of a bat count June 15 at an abandoned ranch house in remote Lincoln County."}];

  var idx = 0;
  var img = document.getElementById("pjg-img");
  var cap = document.getElementById("pjg-caption");
  var head = document.getElementById("pjg-headline");
  var text = document.getElementById("pjg-text");
  var frame = document.getElementById("pjg-frame");

  img.addEventListener("load", function () { img.style.opacity = 1; });

  function preload(i) {
    var n = (i + photos.length) % photos.length;
    var p = new Image();
    p.src = photos[n].src;
  }

  function show(i) {
    idx = (i + photos.length) % photos.length;
    var p = photos[idx];
    img.style.opacity = 0;
    img.src = p.src;
    img.alt = p.headline || p.caption;
    head.textContent = p.headline;
    text.textContent = p.caption;
    cap.style.display = (p.headline || p.caption) ? "" : "none";
    frame.classList.remove("show-caption");
    preload(idx + 1);
    preload(idx - 1);
  }

  document.getElementById("pjg-prev").addEventListener("click", function () { show(idx - 1); });
  document.getElementById("pjg-next").addEventListener("click", function () { show(idx + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  });

  var startX = null;
  frame.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener("touchend", function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) show(dx > 0 ? idx - 1 : idx + 1);
  });

  if (window.matchMedia("(hover: none)").matches) {
    frame.addEventListener("click", function () { frame.classList.toggle("show-caption"); });
  }

  show(0);
</script>
</body>
