<div class="pjg-viewer">
  <button class="pjg-arrow" id="pjg-prev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 4 7 12 15 20"/></svg>
  </button>
  <div class="pjg-stage">
    <div class="pjg-frame" id="pjg-frame">
      <img id="pjg-img" alt=""/>
      <div class="pjg-caption" id="pjg-caption">
        <div class="pjg-headline" id="pjg-headline"></div>
        <div class="pjg-text" id="pjg-text"></div>
      </div>
    </div>
  </div>
  <button class="pjg-arrow" id="pjg-next" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 4 17 12 9 20"/></svg>
  </button>
</div>

<script>
  var photos = [{"src": "images/photography/features/01a-cover-walt.jpg", "headline": "Goodbye Glenrock", "caption": "Walt Peterson, a lifelong resident of Glenrock, packs all of his family's possessions into a trailer attached to his Jeep. The Danaher subdivision is being rezoned, forcing most of its mobile home owners to leave town. The Petersons are abandoning their home of 20 years to move to Alabama."}, {"src": "images/photography/features/03a-louis.jpg", "headline": "Walking by faith", "caption": "Louis Grimes has been walking America by foot for decades. He's still preaching, but after losing his sight, he's settled down in Douglas."}, {"src": "images/photography/features/03b-louis.jpg", "headline": "Walking by faith", "caption": "Grimes sits in his apartment and places one of his well-worn Bibles in front of a machine that reads text aloud to him. After reading the Bible nightly for much of his life, Grimes has large sections of it memorized."}, {"src": "images/photography/features/03c-louis.jpg", "headline": "Walking by faith", "caption": "Grimes feels the pages of his two Bibles."}, {"src": "images/photography/features/03d-louis.jpg", "headline": "Walking by faith", "caption": "Despite being blind, Grimes decorated a tree for Christmas and placed it in his window."}, {"src": "images/photography/features/04-carl.jpg", "headline": "Mothing to boast of", "caption": "Carl Barrentine examines a moth attracted to one of his ultraviolet lights Sept. 1, 2022, in his Spokane backyard. Barrentine captures moths every night from March through November and documents his findings. He's one of the world's most prolific moth-ers and has observed dozens of species entomologists hadn't previously recorded in the Inland Northwest."}, {"src": "images/photography/features/05-bob.jpg", "headline": "Bloomsday", "caption": "Bob Felton jogs through a covered bridge March 24 in Newport, New Hampshire to stage a photo. Felton runs in Bloomsday — Spokane's annual road race — every year despite moving away more than 20 years ago."}, {"src": "images/photography/features/06-east-hartford.jpg", "headline": "High expectations", "caption": "Fourth graders Catarina Catorze, left, and Emily Rivera work on math problems Sept. 24 at Langford Elementary School in East Hartford. Over the last 10 years, East Hartford's test scores have improved dramatically."}, {"src": "images/photography/features/06a-east-hartford.jpg", "headline": "High expectations", "caption": "Fourth grade teacher Emma Kerr gives her students instructions Sept. 24 before sending them off to learn about fractions at Langford Elementary School in East Hartford."}, {"src": "images/photography/features/06b-east-hartford.jpg", "headline": "High expecations", "caption": "Fourth graders Eviana Gonzalez and Zoee Gilles match up equivalent fractions Sept. 24 at Langford Elementary School in East Hartford."}, {"src": "images/photography/features/06c-east-hartford.jpg", "headline": "High expecations", "caption": "Fourth grade teacher Amy Cancellieri helps Zoee Gilles, left, and Eviana Gonzalez work through fraction problems Sept. 24 at Langford Elementary School in East Hartford."}, {"src": "images/photography/features/06d-east-hartford.jpg", "headline": "High expectations", "caption": "Fourth grader Jason Oteng uses a magnet to stick his packet of math problems to a whiteboard Sept. 24 at Langford Elementary School in East Hartford."}];

  var idx = 0;
  var img = document.getElementById("pjg-img");
  var cap = document.getElementById("pjg-caption");
  var head = document.getElementById("pjg-headline");
  var text = document.getElementById("pjg-text");
  var frame = document.getElementById("pjg-frame");

  img.addEventListener("load", function () { img.style.opacity = 1; });

  function preload(i) {
    var n = (i + photos.length) % photos.length;
    var p = new Image();
    p.src = photos[n].src;
  }

  function show(i) {
    idx = (i + photos.length) % photos.length;
    var p = photos[idx];
    img.style.opacity = 0;
    img.src = p.src;
    img.alt = p.headline || p.caption;
    head.textContent = p.headline;
    text.textContent = p.caption;
    cap.style.display = (p.headline || p.caption) ? "" : "none";
    frame.classList.remove("show-caption");
    preload(idx + 1);
    preload(idx - 1);
  }

  document.getElementById("pjg-prev").addEventListener("click", function () { show(idx - 1); });
  document.getElementById("pjg-next").addEventListener("click", function () { show(idx + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  });

  var startX = null;
  frame.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener("touchend", function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) show(dx > 0 ? idx - 1 : idx + 1);
  });

  if (window.matchMedia("(hover: none)").matches) {
    frame.addEventListener("click", function () { frame.classList.toggle("show-caption"); });
  }

  show(0);
</script>
</body>
</html>
