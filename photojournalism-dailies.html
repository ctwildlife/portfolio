<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
<title>Dailies | Colin Tiernan</title>
</head>
<body class="pjg-page">
<header class="site-header">
  <a href="index.html"><span class="site-name">Colin Tiernan</span></a>
  <nav class="site-nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="photos.html" aria-current="page">Photos</a>
    <a href="about.html">About</a>

</header>
<div class="pjg-viewer">
  <button class="pjg-arrow" id="pjg-prev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 4 7 12 15 20"/></svg>
  </button>
  <div class="pjg-stage">
    <div class="pjg-frame" id="pjg-frame">
      <img id="pjg-img" alt=""/>
      <div class="pjg-caption" id="pjg-caption">
        <div class="pjg-headline" id="pjg-headline"></div>
        <div class="pjg-text" id="pjg-text"></div>
      </div>
    </div>
  </div>
  <button class="pjg-arrow" id="pjg-next" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 4 17 12 9 20"/></svg>
  </button>
</div>

<script>
  var photos = [{"src": "images/photography/dailies/01-cover-gray-fire.jpg", "headline": "Gray Fire ravages Medical Lake", "caption": "Isaiah Tonasket looks at the burning rubble of his family's home Friday night in Medical Lake. 'I cried a little bit, not gonna lie,' he said."}, {"src": "images/photography/dailies/02-gray-fire.jpg", "headline": "Gray Fire ravages Medical Lake", "caption": "Doctors Svetlana Cox, Brian Sweatt and Daniel Sim watch the Gray Fire on Friday from a hill in the middle of an alfalfa field near Eastern State Hospital. The Gray Fire destroyed over 200 homes, making it one of the most destructive fires in Washington history."}, {"src": "images/photography/dailies/02a-skater.jpg", "headline": "New Year's on ice", "caption": "A skater zips by on New Year's Eve while looping the Skate Ribbon at Riverfront Park in downtown Spokane."}, {"src": "images/photography/dailies/03-smoke.jpg", "headline": "Smoky hills", "caption": "Wildfire smoke casts a haze over the Palouse on July 22 near Wilbur."}, {"src": "images/photography/dailies/03a-black-friday.jpg", "headline": "Black Friday", "caption": "Jeffery Brendmoen stocks toys Friday at The General Store in Spokane."}, {"src": "images/photography/dailies/04-first-day-of-class-csi.jpg", "headline": "Back to school", "caption": "College of Southern Idaho student Madeline Wherry waits for class to begin Monday on the first day of the fall semester."}, {"src": "images/photography/dailies/06-sunset.jpg", "headline": "Saltese sunset", "caption": "A young couple, who chose to remain anonymous, watch the sunset Thursday from a high point in the Saltese Uplands Conservation Area southeast of Spokane Valley."}];

  var idx = 0;
  var img = document.getElementById("pjg-img");
  var cap = document.getElementById("pjg-caption");
  var head = document.getElementById("pjg-headline");
  var text = document.getElementById("pjg-text");
  var frame = document.getElementById("pjg-frame");

  img.addEventListener("load", function () { img.style.opacity = 1; });

  function preload(i) {
    var n = (i + photos.length) % photos.length;
    var p = new Image();
    p.src = photos[n].src;
  }

  function show(i) {
    idx = (i + photos.length) % photos.length;
    var p = photos[idx];
    img.style.opacity = 0;
    img.src = p.src;
    img.alt = p.headline || p.caption;
    head.textContent = p.headline;
    text.textContent = p.caption;
    cap.style.display = (p.headline || p.caption) ? "" : "none";
    frame.classList.remove("show-caption");
    preload(idx + 1);
    preload(idx - 1);
  }

  document.getElementById("pjg-prev").addEventListener("click", function () { show(idx - 1); });
  document.getElementById("pjg-next").addEventListener("click", function () { show(idx + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  });

  var startX = null;
  frame.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener("touchend", function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) show(dx > 0 ? idx - 1 : idx + 1);
  });

  if (window.matchMedia("(hover: none)").matches) {
    frame.addEventListener("click", function () { frame.classList.toggle("show-caption"); });
  }

  show(0);
</script>
</body>
</html>
