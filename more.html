<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>More stories | Colin Tiernan</title>
  <meta name="description" content="More reporting by Colin Tiernan.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html">
      <span class="site-name">Colin Tiernan</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="stories.html" aria-current="page">Stories</a>
      <a href="photos.html">Photos</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section class="beat">
      <h2>More stories</h2>
      <ul class="grid" id="stories"></ul>
    </section>
  </main>

  <script src="js/more-stories.js"></script>
  <script>
    const list = document.getElementById("stories");

    for (const s of MORE_STORIES) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "card";
      a.href = s.link;
      a.target = "_blank";
      a.rel = "noopener";

      const img = document.createElement("img");
      img.src = s.image;
      img.alt = "";
      img.loading = "lazy";

      const h3 = document.createElement("h3");
      h3.textContent = s.title;

      a.append(img, h3);
      li.append(a);
      list.append(li);
    }
  </script>
</body>
</html>
