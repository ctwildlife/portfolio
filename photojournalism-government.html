<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Government | Colin Tiernan</title>
</head>
<body class="pjg-page">
<header class="site-header">
  <a href="index.html"><span class="site-name">Colin Tiernan</span></a>
  <nav class="site-nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="photos.html" aria-current="page">Photos</a>
    <a href="about.html">About</a>
  </nav>
</header>
<div class="pjg-viewer">
  <button class="pjg-arrow" id="pjg-prev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 4 7 12 15 20"/></svg>
  </button>
  <div class="pjg-stage">
    <div class="pjg-frame" id="pjg-frame">
      <img id="pjg-img" alt=""/>
      <div class="pjg-caption" id="pjg-caption">
        <div class="pjg-headline" id="pjg-headline"></div>
        <div class="pjg-text" id="pjg-text"></div>
      </div>
    </div>
  </div>
  <button class="pjg-arrow" id="pjg-next" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 4 17 12 9 20"/></svg>
  </button>
</div>

<script>
  var photos = [{"src": "images/photography/government/01-cover-little.jpg", "headline": "Little tours antibody site", "caption": "Idaho Gov. Brad Little speaks to the press Wednesday at a monoclonal antibody treatment site in Coeur d'Alene."}, {"src": "images/photography/government/02-saltese.jpg", "headline": "A farmer's demand in honor of his mother", "caption": "Spokane County Commissioner Mary Kuney, right, hugs Bud Morrison on Friday at a groundbreaking for the Doris Morrison Learning Center at Saltese Flats."}, {"src": "images/photography/government/03-storment.jpg", "headline": "Cracking the case", "caption": "Spokane Police Department Sgt. Zac Storment talks during a press conference Friday after solving the Candy Rogers cold case."}, {"src": "images/photography/government/04-waldref.jpg", "headline": "Fraud settlement", "caption": "U.S. District Attorney Vanessa Waldref speaks at a news conference Tuesday in front of the Thomas S. Foley United States Courthouse in downtown Spokane."}, {"src": "images/photography/government/05-lamont.jpg", "headline": "Fighting Trump", "caption": "Connecticut Gov. Ned Lamont discusses the importance of Head Start on Tuesday in New Haven."}];

  var idx = 0;
  var img = document.getElementById("pjg-img");
  var cap = document.getElementById("pjg-caption");
  var head = document.getElementById("pjg-headline");
  var text = document.getElementById("pjg-text");
  var frame = document.getElementById("pjg-frame");

  img.addEventListener("load", function () { img.style.opacity = 1; });

  function preload(i) {
    var n = (i + photos.length) % photos.length;
    var p = new Image();
    p.src = photos[n].src;
  }

  function show(i) {
    idx = (i + photos.length) % photos.length;
    var p = photos[idx];
    img.style.opacity = 0;
    img.src = p.src;
    img.alt = p.headline || p.caption;
    head.textContent = p.headline;
    text.textContent = p.caption;
    cap.style.display = (p.headline || p.caption) ? "" : "none";
    frame.classList.remove("show-caption");
    preload(idx + 1);
    preload(idx - 1);
  }

  document.getElementById("pjg-prev").addEventListener("click", function () { show(idx - 1); });
  document.getElementById("pjg-next").addEventListener("click", function () { show(idx + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  });

  var startX = null;
  frame.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener("touchend", function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) show(dx > 0 ? idx - 1 : idx + 1);
  });

  if (window.matchMedia("(hover: none)").matches) {
    frame.addEventListener("click", function () { frame.classList.toggle("show-caption"); });
  }

  show(0);
</script>
</body>
</html>
